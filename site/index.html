<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>pptx-viewer has moved</title>
		<link rel="canonical" href="https://christophervr.github.io/ooxml/pptx/" />
		<script>
			// Every page of the old site has the same path under the new one:
			// /pptx-viewer/demo-vue/ becomes /ooxml/pptx/demo-vue/.
			(function () {
				var path = location.pathname.replace(/^\/pptx-viewer(?=\/|$)/, '') || '/';
				location.replace(
					'https://christophervr.github.io/ooxml/pptx' + path + location.search + location.hash,
				);
			})();
		</script>
		<meta http-equiv="refresh" content="2;url=https://christophervr.github.io/ooxml/pptx/" />
	</head>
	<body>
		<p>
			pptx-viewer has moved to
			<a href="https://christophervr.github.io/ooxml/pptx/">christophervr.github.io/ooxml/pptx</a>.

	</body>
</html>
