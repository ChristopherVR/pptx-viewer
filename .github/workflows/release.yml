name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      # Decide which packages actually changed since the last release and the
      # next version. Only changed packages are versioned, packed, and released;
      # unchanged ones keep their published version and are skipped. See
      # scripts/release-plan.mjs for the dependency model. `--write` stamps the
      # new version into each released package's package.json.
      - name: Plan release
        id: version
        run: node scripts/release-plan.mjs --write

      - name: Pack pptx-viewer-core
        if: steps.version.outputs.release_core == 'true'
        run: cd packages/core && bun pm pack

      - name: Pack pptx-react-viewer
        if: steps.version.outputs.release_react == 'true'
        run: cd packages/react && bun pm pack

      - name: Pack pptx-viewer-tools
        if: steps.version.outputs.release_tools == 'true'
        run: cd packages/tools && bun pm pack

      - name: Pack pptx-vue-viewer
        if: steps.version.outputs.release_vue == 'true'
        run: cd packages/vue && bun pm pack

      # The Angular library is published from its ng-packagr `dist/` (built
      # above), NOT from the package root. dist/package.json carries the version
      # and a concrete pptx-viewer-core range baked in at build time, so patch
      # the version (release version) and the core range (the live core version,
      # which may differ when core itself was not part of this release).
      - name: Pack pptx-angular-viewer
        if: steps.version.outputs.release_angular == 'true'
        run: |
          VERSION="${{ steps.version.outputs.next_version }}"
          CORE_VERSION="${{ steps.version.outputs.core_version }}"
          node -e "
            const fs = require('fs');
            const p = 'packages/angular/dist/package.json';
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            data.version = '${VERSION}';
            for (const field of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
              const deps = data[field];
              if (deps && deps['pptx-viewer-core']) deps['pptx-viewer-core'] = '^${CORE_VERSION}';
            }
            fs.writeFileSync(p, JSON.stringify(data, null, '\t') + '\n');
          "
          cd packages/angular/dist && bun pm pack

      # ── Changelog (git-cliff, see cliff.toml) ────────────────────────
      # Regenerate CHANGELOG.md treating the new commits as the next tag,
      # commit it back to main, and reuse the latest section as the GitHub
      # release body. The GITHUB_TOKEN push does not retrigger workflows, and
      # `[skip ci]` guards against it regardless. NOTE: if `main` is protected
      # against direct pushes, allow the actions bot or relax the rule.
      - name: Generate changelog
        if: steps.version.outputs.any_changed == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.tag }} --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog
        if: steps.version.outputs.any_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged — nothing to commit"
          else
            git add CHANGELOG.md
            git commit -m "docs(changelog): update for ${{ steps.version.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Extract latest release notes
        if: steps.version.outputs.any_changed == 'true'
        run: awk '/^## \[/{c++} c==1{print} c==2{exit}' CHANGELOG.md > "${RUNNER_TEMP}/release_notes.md"

      # Only the packed (changed) packages have a .tgz; the other globs simply
      # match nothing (fail_on_unmatched_files defaults to false).
      - name: Create release
        if: steps.version.outputs.any_changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: |
            packages/core/*.tgz
            packages/react/*.tgz
            packages/tools/*.tgz
            packages/vue/*.tgz
            packages/angular/dist/*.tgz
