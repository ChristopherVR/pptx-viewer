name: Release

on:
  # Scheduled releases: the planner is cumulative (each package is diffed from
  # its own last tag), so everything merged since the previous run lands in one
  # release per changed package. A run with no changes exits at the planning
  # step, so quiet hours are cheap no-ops.
  schedule:
    # Hourly, on the hour.
    - cron: '0 * * * *'
  # Manual runs, two modes:
  #   - no input: run a full release now (same as the schedule).
  #   - tag=<npm-name>@<version>: re-publish ONLY that existing tag to npm,
  #     skipping the release job. Useful when a publish was skipped or failed:
  #       gh workflow run release.yml -f tag=pptx-viewer-core@1.2.3
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-publish (leave empty to cut a full release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  id-token: write # Required for OIDC npm trusted publishing and provenance
  actions: write # Required to dispatch the docs/Pages deploy after a release

jobs:
  release:
    # Full release on schedule, or on manual dispatch without a tag input.
    # Dispatch WITH a tag skips straight to the publish job (re-publish mode).
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    outputs:
      any_released: ${{ steps.tagged.outputs.any_released || 'false' }}
      released_keys: ${{ steps.tagged.outputs.released_keys || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Run the release plan FIRST (before any builds) -- it only reads git
      # history and the npm registry, so no built artifacts are needed. It is
      # also the early-exit gate: if no package changed since its last tag the
      # plan outputs any_changed=false and all later steps are skipped, so a
      # scheduled run on a quiet week is a cheap no-op.
      - name: Plan release
        id: plan
        run: node scripts/release-plan.mjs --write

      # Foundation packages must always build cleanly before framework builds.
      - name: Build foundation packages
        if: steps.plan.outputs.any_changed == 'true'
        run: |
          bun run --filter 'pptx-viewer-core' build
          bun run --filter 'pptx-viewer-shared' build
          bun run --filter 'pptx-viewer-mcp' build
          bun run --filter '@christophervr/pptx-viewer' build

      # Framework bindings: each can fail without blocking the others.
      - name: Build React
        id: build-react
        if: steps.plan.outputs.any_changed == 'true'
        run: bun run --filter 'pptx-react-viewer' build
        continue-on-error: true

      - name: Build Vue
        id: build-vue
        if: steps.plan.outputs.any_changed == 'true'
        run: bun run --filter 'pptx-vue-viewer' build
        continue-on-error: true

      - name: Build Angular
        id: build-angular
        if: steps.plan.outputs.any_changed == 'true'
        run: bun run --filter 'pptx-angular-viewer' build
        continue-on-error: true

      - name: Build Vanilla
        id: build-vanilla
        if: steps.plan.outputs.any_changed == 'true'
        run: bun run --filter 'pptx-vanilla-viewer' build
        continue-on-error: true

      - name: Build Svelte
        id: build-svelte
        if: steps.plan.outputs.any_changed == 'true'
        run: bun run --filter 'pptx-svelte-viewer' build
        continue-on-error: true

      # A framework build can fail (continue-on-error above). Its version was
      # already bumped on disk by `release-plan.mjs --write`, but the tag/publish
      # step below is gated on build success, so a failed build would otherwise
      # commit the bump WITHOUT cutting a tag. The baseline is the tag, so on the
      # next run the package still looks "changed" (its tag never moved), bumps
      # again, fails again, and re-releases every hour forever, drifting
      # package.json ahead of the last published tag. Prevent that: for each
      # release:true framework package whose build failed, revert its manifest
      # bump and drop it from the plan so it is neither committed nor tagged.
      # It simply retries on the next run with an unchanged baseline.
      - name: Drop build-failed packages from the release
        if: steps.plan.outputs.any_changed == 'true'
        env:
          REACT_BUILT: ${{ steps.build-react.outcome == 'success' }}
          VUE_BUILT: ${{ steps.build-vue.outcome == 'success' }}
          ANGULAR_BUILT: ${{ steps.build-angular.outcome == 'success' }}
          VANILLA_BUILT: ${{ steps.build-vanilla.outcome == 'success' }}
          SVELTE_BUILT: ${{ steps.build-svelte.outcome == 'success' }}
        run: |
          drop() {
            key="$1"
            release=$(node -p "require('./release-plan.json').packages.$key.release")
            [ "$release" = "true" ] || return 0
            dir=$(node -p "require('./release-plan.json').packages.$key.dir")
            echo "Dropping $key from this release: build failed"
            git checkout HEAD -- "$dir/package.json"
            node -e "const fs=require('fs');const p='./release-plan.json';const j=JSON.parse(fs.readFileSync(p));j.packages['$key'].release=false;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          }
          [ "$REACT_BUILT"   = "true" ] || drop react
          [ "$VUE_BUILT"     = "true" ] || drop vue
          [ "$ANGULAR_BUILT" = "true" ] || drop angular
          [ "$VANILLA_BUILT" = "true" ] || drop vanilla
          [ "$SVELTE_BUILT"  = "true" ] || drop svelte

      # Prepend the new release section to each released package's CHANGELOG.md.
      # Prepend (rather than full regeneration) means shipped sections are never
      # rewritten, so old tags can be culled by prune-releases without corrupting
      # changelog history.
      - name: Generate per-package changelogs
        if: steps.plan.outputs.any_changed == 'true'
        # `[remote.github]` in cliff.toml makes git-cliff call the GitHub API to
        # enrich author handles. Unauthenticated that is 60 requests/hour, and a
        # run paginates commits well past that, so an hourly schedule reliably
        # trips the limit: git-cliff does not degrade gracefully, it panics with
        # `Could not get github metadata: HttpClientError(Status(403))` and takes
        # the release down. Authenticate it (5000/hour) instead.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for key in core react vue angular vanilla svelte tools cli; do
            release=$(node -p "require('./release-plan.json').packages.$key.release")
            [ "$release" = "true" ] || continue
            dir=$(node -p "require('./release-plan.json').packages.$key.dir")
            npm=$(node -p "require('./release-plan.json').packages.$key.npm")
            tag=$(node -p "require('./release-plan.json').packages.$key.tag")
            inc=$(node -e "console.log(require('./release-plan.json').packages.$key.includePaths.map(p => '--include-path ' + p).join(' '))")
            echo "Changelog for $npm -> $tag"
            if [ -f "$dir/CHANGELOG.md" ]; then
              bunx git-cliff --config cliff.toml --tag-pattern "^${npm}@" $inc --unreleased --tag "$tag" --prepend "$dir/CHANGELOG.md"
            else
              bunx git-cliff --config cliff.toml --tag-pattern "^${npm}@" $inc --tag "$tag" --output "$dir/CHANGELOG.md"
            fi
          done

      # Prepend a consolidated, dated section for this run to the root
      # CHANGELOG.md: all conventional commits since the previous release run,
      # plus the list of tags being cut. Prepend-only for the same reason as
      # above: culled tags must never rewrite shipped history.
      - name: Generate root changelog
        if: steps.plan.outputs.any_changed == 'true'
        # Same GitHub API rate-limit exposure as the per-package step above.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TAGS=$(node -p "Object.values(require('./release-plan.json').packages).filter(p => p.release).map(p => p.tag).join(', ')")
          bunx git-cliff --config cliff-root.toml --unreleased --strip all --output "${RUNNER_TEMP}/root-section.md"
          sed -i "s|^## \[Unreleased\]|## ${DATE}\n\n_Releases: ${TAGS}_|" "${RUNNER_TEMP}/root-section.md"
          # Drop any stale "[Unreleased]" section left by the old full-regeneration
          # flow; its commits are re-rendered into the dated section above.
          awk '/^## \[Unreleased\]/{skip=1; next} /^## /{skip=0} !skip{print}' CHANGELOG.md > "${RUNNER_TEMP}/root-clean.md"
          # Insert the new section after the header (before the first existing
          # "## " heading); append at the end if the file has none yet.
          awk 'NR==FNR{sec=sec $0 ORS; next} /^## /&&!ins{printf "%s", sec; ins=1} {print} END{if(!ins) printf "%s", sec}' \
            "${RUNNER_TEMP}/root-section.md" "${RUNNER_TEMP}/root-clean.md" > "${RUNNER_TEMP}/root-out.md"
          mv "${RUNNER_TEMP}/root-out.md" CHANGELOG.md

      - name: Commit version bumps and changelogs
        if: steps.plan.outputs.any_changed == 'true'
        # The GITHUB_TOKEN push does not retrigger workflows, and `[skip ci]`
        # guards against it regardless.
        #
        # IMPORTANT: this pushes straight to `main`, which is only possible while
        # no branch ruleset requires a pull request or status checks there. The
        # default GITHUB_TOKEN cannot be exempted from such a rule -- GitHub does
        # not allow `github-actions[bot]` on a ruleset bypass list at all -- so
        # adding one silently turns every release into a failed run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `release-plan.mjs --write` bumped each package.json `version`, which
          # leaves bun.lock's recorded workspace metadata stale. Regenerate the
          # lockfile so it matches the bumped manifests (dependency resolution is
          # unchanged; only the workspace version fields move) instead of drifting
          # until the next manual `bun install`.
          bun install --lockfile-only
          # Stage the changelogs, the --write version bumps AND the refreshed
          # lockfile, so package.json + bun.lock in the repo always match what is
          # published; the release tag then points at a commit whose manifests are
          # truthful.
          git add packages/*/CHANGELOG.md CHANGELOG.md packages/*/package.json bun.lock
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit -m "chore(release): bump versions and update changelogs [skip ci]"
            # An hourly schedule on a trunk that takes direct pushes will race a
            # human eventually: `main` moves between checkout and here and the
            # push is rejected as non-fast-forward. Rebase the release commit
            # onto the new tip and retry. The tag step reads `git rev-parse HEAD`
            # after this, so it follows the rebased commit automatically.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt was rejected; rebasing onto origin/main"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Release commit conflicts with origin/main; resolve by hand and re-run."
                exit 1
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Could not push the release commit to main after 3 attempts."
              echo "A 'GH013 / rule violations' rejection above means a branch ruleset blocks"
              echo "direct pushes to main: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/rules"
              exit 1
            fi
          fi

      # Cut a per-package tag + GitHub release. The tag points at the (pushed)
      # release commit; the release body is that package's newest changelog
      # section. No tarball assets: npm (with provenance) is the artifact
      # registry, and asset-free releases are cheap to keep forever.
      # A package is released only if it: (a) changed since its last tag AND
      # (b) its framework build succeeded (or it is a non-framework package).
      - name: Tag and release changed packages
        id: tagged
        if: steps.plan.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `release-notes.mjs` shells out to git-cliff, which reads GITHUB_TOKEN
          # (not GH_TOKEN) for `[remote.github]`. Without it the API call is
          # unauthenticated and rate-limited; the script swallows the failure and
          # drops to its raw-commit fallback, so release bodies quietly lose their
          # grouped sections instead of failing loudly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REACT_BUILT: ${{ steps.build-react.outcome == 'success' }}
          VUE_BUILT: ${{ steps.build-vue.outcome == 'success' }}
          ANGULAR_BUILT: ${{ steps.build-angular.outcome == 'success' }}
          VANILLA_BUILT: ${{ steps.build-vanilla.outcome == 'success' }}
          SVELTE_BUILT: ${{ steps.build-svelte.outcome == 'success' }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          RELEASED_KEYS=""
          for key in core react vue angular vanilla svelte tools cli; do
            release=$(node -p "require('./release-plan.json').packages.$key.release")
            [ "$release" = "true" ] || continue

            # Skip framework packages whose build failed this run.
            case "$key" in
              react)   [ "$REACT_BUILT"   = "true" ] || { echo "Skipping react: build failed"; continue; } ;;
              vue)     [ "$VUE_BUILT"     = "true" ] || { echo "Skipping vue: build failed";   continue; } ;;
              angular) [ "$ANGULAR_BUILT" = "true" ] || { echo "Skipping angular: build failed"; continue; } ;;
              vanilla) [ "$VANILLA_BUILT" = "true" ] || { echo "Skipping vanilla: build failed"; continue; } ;;
              svelte)  [ "$SVELTE_BUILT"  = "true" ] || { echo "Skipping svelte: build failed"; continue; } ;;
            esac

            dir=$(node -p "require('./release-plan.json').packages.$key.dir")
            tag=$(node -p "require('./release-plan.json').packages.$key.tag")

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists, skipping"
              continue
            fi

            # Release body = this package's real "what's new" for this tag,
            # from the single-source release-notes generator (grouped git-cliff
            # section, with a raw-commit fallback so a package released off
            # non-conventional commits never renders empty). The pruned-history
            # line below is only ever a footer under that content.
            node scripts/release-notes.mjs "$key" > "${RUNNER_TEMP}/notes.md"
            {
              echo ""
              echo "---"
              echo "Superseded releases are pruned from this page; the full version history lives in [\`$dir/CHANGELOG.md\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/$dir/CHANGELOG.md)."
            } >> "${RUNNER_TEMP}/notes.md"
            gh release create "$tag" \
              --target "$COMMIT" \
              --title "$tag" \
              --notes-file "${RUNNER_TEMP}/notes.md"
            echo "Released $tag"
            RELEASED_KEYS="${RELEASED_KEYS}${key} "
          done
          RELEASED_KEYS="${RELEASED_KEYS% }"
          if [ -n "$RELEASED_KEYS" ]; then
            echo "any_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "released_keys=${RELEASED_KEYS}" >> "$GITHUB_OUTPUT"

      # Stash the release plan so the publish job can resolve package versions
      # without re-running the planner. Artifact names are unique per run.
      - name: Upload release plan for publish job
        if: steps.tagged.outputs.any_released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-plan-${{ github.run_id }}
          path: release-plan.json
          retention-days: 1

      # Immediately retire the releases each new tag supersedes (tags are
      # kept), so the Releases page always lists exactly one release per
      # package: the current version. The scheduled prune-releases workflow is
      # the backstop.
      - name: Prune superseded releases
        if: steps.tagged.outputs.any_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prune-releases.mjs --keep 1

      # Redeploy the docs site + demos ONLY when something was actually
      # released. With an hourly schedule, triggering docs via workflow_run
      # would redeploy Pages on every no-op run; an explicit dispatch here
      # keeps the site tracking releases without the churn.
      - name: Trigger docs deploy
        if: steps.tagged.outputs.any_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref main

  # ── Publish to npm ─────────────────────────────────────────────────────────
  # Runs in two modes:
  #
  # AUTO (schedule, or dispatch without a tag): runs after the `release` job
  #   above; reads the released package list and versions from the
  #   release-plan.json artifact.
  #
  # RE-PUBLISH (dispatch with a tag): skips the `release` job entirely and
  #   publishes exactly the tag supplied via the `tag` input. Checks out at
  #   that tag so the build matches the released snapshot.
  #
  # Auth: OIDC trusted publishing (default) or NPM_TOKEN secret.
  #   - OIDC: requires Node 24+ (npm >= 11.5.1) and publishers linked on
  #     npmjs.com for each package pointing to THIS workflow file
  #     (.github/workflows/release.yml).
  #   - Token fallback: set NPM_TOKEN in the "npm" environment.
  #
  # Packages published per core release:
  #   pptx-viewer-core       https://www.npmjs.com/package/pptx-viewer-core
  publish:
    needs: [release]
    # `always()` lets this job run even when `release` was skipped (re-publish
    # dispatch). Guard: release must not have failed outright, and either
    # something was released or this is a re-publish dispatch with a tag.
    if: |
      always() &&
      needs.release.result != 'failure' && (
        needs.release.outputs.any_released == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing and provenance
    steps:
      # A release tag was already cut (GitHub release + `<npm>@<version>` tag), so
      # silently skipping the publish leaves npm stranded behind the tags with no
      # signal. Fail loudly instead. Set the NPM_PUBLISH repo variable to 'true'.
      - name: Verify publishing is enabled
        if: vars.NPM_PUBLISH != 'true'
        run: |
          echo "::error::NPM_PUBLISH repository variable is not 'true' - npm publishing is disabled."
          echo "Packages were released but npm publishing is disabled."
          echo "Set the NPM_PUBLISH repository variable to 'true' to enable, or re-run this job."
          exit 1

      # Auto mode: check out HEAD so the build includes the release commit.
      - name: Checkout (automated)
        if: inputs.tag == null || inputs.tag == ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Re-publish mode: check out at the exact tag so the build matches the release.
      - name: Checkout at tag (re-publish)
        if: inputs.tag != null && inputs.tag != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      # Download the release plan uploaded by the release job (auto mode only).
      # In re-publish mode the version comes directly from the tag input.
      - name: Download release plan
        if: inputs.tag == null || inputs.tag == ''
        uses: actions/download-artifact@v8
        with:
          name: release-plan-${{ github.run_id }}

      # Node 24 ships npm >= 11.5.1, required for --provenance attestation.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Always build foundation packages regardless of which frameworks were released.
      - name: Build foundation packages
        run: |
          bun run --filter 'pptx-viewer-core' build
          bun run --filter 'pptx-viewer-shared' build
          bun run --filter 'pptx-viewer-mcp' build
          bun run --filter '@christophervr/pptx-viewer' build

      # Build only the framework bindings that need to be published.
      - name: Build released framework packages
        env:
          RELEASED_KEYS: ${{ needs.release.outputs.released_keys }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            NAME="${INPUT_TAG%@*}"
            case "$NAME" in
              pptx-react-viewer)   bun run --filter 'pptx-react-viewer' build ;;
              pptx-vue-viewer)     bun run --filter 'pptx-vue-viewer' build ;;
              pptx-angular-viewer) bun run --filter 'pptx-angular-viewer' build ;;
              pptx-vanilla-viewer) bun run --filter 'pptx-vanilla-viewer' build ;;
              pptx-svelte-viewer)  bun run --filter 'pptx-svelte-viewer' build ;;
            esac
          else
            for key in $RELEASED_KEYS; do
              case "$key" in
                react)   bun run --filter 'pptx-react-viewer' build ;;
                vue)     bun run --filter 'pptx-vue-viewer' build ;;
                angular) bun run --filter 'pptx-angular-viewer' build ;;
                vanilla) bun run --filter 'pptx-vanilla-viewer' build ;;
                svelte)  bun run --filter 'pptx-svelte-viewer' build ;;
              esac
            done
          fi

      - name: Replace mermaid blocks with GitHub links in READMEs
        run: |
          REPO_URL="https://github.com/ChristopherVR/pptx-viewer"
          for readme in packages/core/README.md packages/react/README.md packages/tools/README.md packages/vue/README.md; do
            if [ -f "$readme" ]; then
              github_link="${REPO_URL}/blob/main/${readme}"
              perl -0777 -i -pe "s|\`\`\`mermaid\n.*?\`\`\`|_See the [architecture diagrams on GitHub](${github_link}) for visual representations._|gs" "$readme"
              echo "Processed $readme"
            fi
          done

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASED_KEYS: ${{ needs.release.outputs.released_keys }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Resolve the list of keys to publish and a version for each.
          # In re-publish mode: parse key + version from the tag input.
          # In auto mode: read from the release-plan.json artifact.
          declare -A VERSIONS

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            # Validate: only allow characters legal in an npm tag (<name>@<semver>).
            case "$TAG" in
              *[!A-Za-z0-9.@/_-]*)
                echo "::error::Invalid tag format: '$TAG'. Expected <npm-name>@<semver>."
                exit 1
                ;;
            esac
            NAME="${TAG%@*}"
            VERSION="${TAG##*@}"
            case "$NAME" in
              pptx-viewer-core)    KEY="core"    ;;
              pptx-react-viewer)   KEY="react"   ;;
              pptx-vue-viewer)     KEY="vue"     ;;
              pptx-angular-viewer) KEY="angular" ;;
              pptx-vanilla-viewer) KEY="vanilla" ;;
              pptx-svelte-viewer)  KEY="svelte"  ;;
              pptx-viewer-mcp)     KEY="tools"   ;;
              @christophervr/pptx-viewer) KEY="cli"  ;;
              *)
                echo "::error::Unknown package name: $NAME (from tag: $TAG)"
                exit 1
                ;;
            esac
            KEYS="$KEY"
            VERSIONS[$KEY]="$VERSION"
            CORE_VERSION=$(npm view pptx-viewer-core version 2>/dev/null || echo "")
          else
            KEYS="$RELEASED_KEYS"
            CORE_VERSION=$(node -p "require('./release-plan.json').coreVersion")
            for key in $KEYS; do
              VERSIONS[$key]=$(node -p "require('./release-plan.json').packages['${key}'].version")
            done
          fi

          for key in $KEYS; do
            VERSION="${VERSIONS[$key]}"
            echo "--- Publishing $key @ $VERSION ---"

            case "$key" in
              # https://www.npmjs.com/package/pptx-viewer-core
              core)
                npm pkg set version="$VERSION" --prefix packages/core

                EXISTING=$(npm view pptx-viewer-core@"$VERSION" version 2>/dev/null || echo "")
                if [ "$EXISTING" = "$VERSION" ]; then
                  echo "pptx-viewer-core@$VERSION already published, skipping"
                else
                  (cd packages/core && npm publish --provenance --access public)
                fi
                ;;

              # https://www.npmjs.com/package/pptx-react-viewer
              # Published as "pptx-react-viewer" (renamed from local "pptx-viewer").
              # pptx-viewer-core / pptx-viewer-shared are bundled into dist, so the
              # published manifest must drop those internal workspace devDeps.
              react)
                node -e "
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('packages/react/package.json', 'utf8'));
                  data.name = 'pptx-react-viewer';
                  data.version = '${VERSION}';
                  if (data.devDependencies) {
                    for (const [k, v] of Object.entries(data.devDependencies)) {
                      if (typeof v === 'string' && v.startsWith('workspace:')) delete data.devDependencies[k];
                    }
                  }
                  fs.writeFileSync('packages/react/package.json', JSON.stringify(data, null, '\t') + '\n');
                "
                EXISTING=$(npm view pptx-react-viewer@"$VERSION" version 2>/dev/null || echo "")
                if [ "$EXISTING" = "$VERSION" ]; then
                  echo "pptx-react-viewer@$VERSION already published, skipping"
                else
                  (cd packages/react && npm publish --provenance --access public)
                fi
                ;;

              # https://www.npmjs.com/package/pptx-vue-viewer
              vue)
                node -e "
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('packages/vue/package.json', 'utf8'));
                  data.version = '${VERSION}';
                  if (data.devDependencies) {
                    for (const [k, v] of Object.entries(data.devDependencies)) {
                      if (typeof v === 'string' && v.startsWith('workspace:')) delete data.devDependencies[k];
                    }
                  }
                  fs.writeFileSync('packages/vue/package.json', JSON.stringify(data, null, '\t') + '\n');
                "
                EXISTING=$(npm view pptx-vue-viewer@"$VERSION" version 2>/dev/null || echo "")
                if [ "$EXISTING" = "$VERSION" ]; then
                  echo "pptx-vue-viewer@$VERSION already published, skipping"
                else
                  (cd packages/vue && npm publish --provenance --access public)
                fi
                ;;

              # https://www.npmjs.com/package/pptx-vanilla-viewer
              # pptx-viewer-core / pptx-viewer-shared are bundled into dist, so the
              # published manifest must drop those internal workspace devDeps.
              vanilla)
                node -e "
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('packages/vanilla/package.json', 'utf8'));
                  data.version = '${VERSION}';
                  if (data.devDependencies) {
                    for (const [k, v] of Object.entries(data.devDependencies)) {
                      if (typeof v === 'string' && v.startsWith('workspace:')) delete data.devDependencies[k];
                    }
                  }
                  fs.writeFileSync('packages/vanilla/package.json', JSON.stringify(data, null, '\t') + '\n');
                "
                EXISTING=$(npm view pptx-vanilla-viewer@"$VERSION" version 2>/dev/null || echo "")
                if [ "$EXISTING" = "$VERSION" ]; then
                  echo "pptx-vanilla-viewer@$VERSION already published, skipping"
                else
                  (cd packages/vanilla && npm publish --provenance --access public)
                fi
                ;;

              # https://www.npmjs.com/package/pptx-svelte-viewer
              # pptx-viewer-core / pptx-viewer-shared are bundled into dist, so the
              # published manifest must drop those internal workspace devDeps.
              svelte)
                node -e "
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('packages/svelte/package.json', 'utf8'));
                  data.version = '${VERSION}';
                  if (data.devDependencies) {
                    for (const [k, v] of Object.entries(data.devDependencies)) {
                      if (typeof v === 'string' && v.startsWith('workspace:')) delete data.devDependencies[k];
                    }
                  }
                  fs.writeFileSync('packages/svelte/package.json', JSON.stringify(data, null, '\t') + '\n');
                "
                EXISTING=$(npm view pptx-svelte-viewer@"$VERSION" version 2>/dev/null || echo "")
                if [ "$EXISTING" = "$VERSION" ]; then
                  echo "pptx-svelte-viewer@$VERSION already published, skipping"
                else
                  (cd packages/svelte && npm publish --provenance --access public)
                fi
                ;;

              # https://www.npmjs.com/package/pptx-angular-viewer
              # Published from ng-packagr's dist/. Point the core range at the live
              # published core (angular versions independently of core).
              angular)
                [ -f packages/angular/CHANGELOG.md ] && cp packages/angular/CHANGELOG.md packages/angular/dist/CHANGELOG.md
                node -e "
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('packages/angular/dist/package.json', 'utf8'));
                  data.version = '${VERSION}';
                  const core = '${CORE_VERSION}';
                  if (core) {
                    for (const f of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
                      if (data[f] && data[f]['pptx-viewer-core']) data[f]['pptx-viewer-core'] = '^' + core;
                    }
                  }
                  fs.writeFileSync('packages/angular/dist/package.json', JSON.stringify(data, null, '\t') + '\n');
                "
                EXISTING=$(npm view pptx-angular-viewer@"$VERSION" version 2>/dev/null || echo "")
                if [ "$EXISTING" = "$VERSION" ]; then
                  echo "pptx-angular-viewer@$VERSION already published, skipping"
                else
                  (cd packages/angular/dist && npm publish --provenance --access public)
                fi
                ;;

              # https://www.npmjs.com/package/pptx-viewer-mcp
              tools)
                npm pkg set version="$VERSION" --prefix packages/tools
                EXISTING=$(npm view pptx-viewer-mcp@"$VERSION" version 2>/dev/null || echo "")
                if [ "$EXISTING" = "$VERSION" ]; then
                  echo "pptx-viewer-mcp@$VERSION already published, skipping"
                else
                  (cd packages/tools && npm publish --provenance --access public)
                fi
                ;;

              # https://www.npmjs.com/package/@christophervr/pptx-viewer
              cli)
                npm pkg set version="$VERSION" --prefix packages/cli
                EXISTING=$(npm view @christophervr/pptx-viewer@"$VERSION" version 2>/dev/null || echo "")
                if [ "$EXISTING" = "$VERSION" ]; then
                  echo "@christophervr/pptx-viewer@$VERSION already published, skipping"
                else
                  (cd packages/cli && npm publish --provenance --access public)
                fi
                ;;
            esac
          done
