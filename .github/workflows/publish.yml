name: Publish to npm (manual)

# ──────────────────────────────────────────────────────────────
# MANUAL re-publish fallback for a specific tag.
#
# Automatic publishing is handled by the `publish` job inside release.yml,
# which runs immediately after GitHub releases are cut. That job sidesteps
# the GitHub limitation where GITHUB_TOKEN-triggered `release` events do not
# fire other workflows.
#
# Use this workflow when you need to re-publish a tag that was skipped or
# failed in the automated run:
#
#   gh workflow run publish.yml -f tag=pptx-viewer-core@1.2.3
#
# Auth: OIDC trusted publishing (default) or NPM_TOKEN secret.
#   - OIDC: requires Node 24+ (npm >= 11.5.1) and linked
#     publishers configured on npmjs.com for each package.
#   - Token fallback: set NPM_TOKEN secret in the "npm"
#     environment to use token auth instead.
#
# Packages published per tag:
#   pptx-viewer-core    → pptx-viewer-core + @christophervr/pptx-viewer
#   pptx-react-viewer   → pptx-react-viewer
#   pptx-vue-viewer     → pptx-vue-viewer
#   pptx-angular-viewer → pptx-angular-viewer
#   pptx-viewer-mcp     → pptx-viewer-mcp
# ──────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. pptx-viewer-core@1.2.3)'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing & provenance
    steps:
      # A release tag was already cut (GitHub release + `<npm>@<version>` tag), so
      # silently skipping the publish leaves npm stranded behind the tags with no
      # signal (exactly how 1.1.24-1.1.29 never reached npm). Fail loudly instead.
      # Set the NPM_PUBLISH repo variable to 'true' to enable publishing.
      - name: Verify publishing is enabled
        if: vars.NPM_PUBLISH != 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::error::NPM_PUBLISH repository variable is not 'true' - refusing to skip silently."
          echo "Release '${RELEASE_TAG}' was published but npm publishing is disabled."
          echo "Set the NPM_PUBLISH repository variable to 'true' to publish, or delete the release if unintended."
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      # Tag format is `<npm-name>@<version>`. Anything else (legacy `vX.Y.Z`
      # tags, date tags) yields a name that matches no package, so every publish
      # step below is skipped.
      - name: Parse release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          echo "name=${TAG%@*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Install dependencies
        run: bun install

      # Build only the packages required to publish this specific tag rather
      # than the entire monorepo. This lets Angular and React publish even when
      # an unrelated package (e.g. Vue) has a build failure.
      - name: Build required packages
        run: |
          # Foundation — always needed.
          bun run --filter 'pptx-viewer-core' build
          bun run --filter 'pptx-viewer-shared' build
          bun run --filter 'pptx-viewer-mcp' build

          # Build the specific framework binding being published.
          case "${{ steps.tag.outputs.name }}" in
            pptx-react-viewer)   bun run --filter 'pptx-react-viewer' build ;;
            pptx-vue-viewer)     bun run --filter 'pptx-vue-viewer' build ;;
            pptx-angular-viewer) bun run --filter 'pptx-angular-viewer' build ;;
          esac

      - name: Replace mermaid blocks with GitHub links in READMEs
        run: |
          REPO_URL="https://github.com/ChristopherVR/pptx-viewer"
          for readme in packages/core/README.md packages/react/README.md packages/tools/README.md packages/vue/README.md; do
            if [ -f "$readme" ]; then
              github_link="${REPO_URL}/blob/main/${readme}"
              perl -0777 -i -pe "s|\`\`\`mermaid\n.*?\`\`\`|_See the [architecture diagrams on GitHub](${github_link}) for visual representations._|gs" "$readme"
              echo "Processed $readme"
            fi
          done

      # https://www.npmjs.com/package/pptx-viewer-core
      # https://www.npmjs.com/package/@christophervr/pptx-viewer
      - name: Publish pptx-viewer-core
        if: steps.tag.outputs.name == 'pptx-viewer-core'
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          npm pkg set version="$VERSION"
          EXISTING=$(npm view pptx-viewer-core@"$VERSION" version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "pptx-viewer-core@$VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi
          # Also publish as scoped alias @christophervr/pptx-viewer so consumers
          # using that scope stay in sync. OIDC trusted publishing for this name
          # must be configured separately on npmjs.com.
          SCOPED_EXISTING=$(npm view @christophervr/pptx-viewer@"$VERSION" version 2>/dev/null || echo "")
          if [ "$SCOPED_EXISTING" = "$VERSION" ]; then
            echo "@christophervr/pptx-viewer@$VERSION already published, skipping"
          else
            npm pkg set name="@christophervr/pptx-viewer"
            npm publish --provenance --access public
            npm pkg set name="pptx-viewer-core"
          fi

      # https://www.npmjs.com/package/pptx-react-viewer
      # Published as "pptx-react-viewer" (renamed from the local "pptx-viewer").
      # pptx-viewer-core / pptx-viewer-shared are bundled into dist, so the
      # published manifest must drop those internal workspace devDeps.
      - name: Publish pptx-react-viewer
        if: steps.tag.outputs.name == 'pptx-react-viewer'
        working-directory: packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            data.name = 'pptx-react-viewer';
            data.version = '${VERSION}';
            if (data.devDependencies) {
              for (const [k, v] of Object.entries(data.devDependencies)) {
                if (typeof v === 'string' && v.startsWith('workspace:')) delete data.devDependencies[k];
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(data, null, '\t') + '\n');
          "
          EXISTING=$(npm view pptx-react-viewer@"$VERSION" version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "pptx-react-viewer@$VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi

      # https://www.npmjs.com/package/pptx-vue-viewer
      - name: Publish pptx-vue-viewer
        if: steps.tag.outputs.name == 'pptx-vue-viewer'
        working-directory: packages/vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            data.version = '${VERSION}';
            if (data.devDependencies) {
              for (const [k, v] of Object.entries(data.devDependencies)) {
                if (typeof v === 'string' && v.startsWith('workspace:')) delete data.devDependencies[k];
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(data, null, '\t') + '\n');
          "
          EXISTING=$(npm view pptx-vue-viewer@"$VERSION" version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "pptx-vue-viewer@$VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi

      # https://www.npmjs.com/package/pptx-angular-viewer
      # Published from ng-packagr's dist/. Point the core range at the live
      # published core (angular versions independently of core).
      - name: Publish pptx-angular-viewer
        if: steps.tag.outputs.name == 'pptx-angular-viewer'
        working-directory: packages/angular/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          CORE_VERSION=$(npm view pptx-viewer-core version 2>/dev/null || echo "")
          [ -f ../CHANGELOG.md ] && cp ../CHANGELOG.md CHANGELOG.md
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            data.version = '${VERSION}';
            const core = '${CORE_VERSION}';
            if (core) {
              for (const f of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
                if (data[f] && data[f]['pptx-viewer-core']) data[f]['pptx-viewer-core'] = '^' + core;
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(data, null, '\t') + '\n');
          "
          EXISTING=$(npm view pptx-angular-viewer@"$VERSION" version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "pptx-angular-viewer@$VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi

      # https://www.npmjs.com/package/pptx-viewer-mcp
      - name: Publish pptx-viewer-mcp
        if: steps.tag.outputs.name == 'pptx-viewer-mcp'
        working-directory: packages/tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          npm pkg set version="$VERSION"
          EXISTING=$(npm view pptx-viewer-mcp@"$VERSION" version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "pptx-viewer-mcp@$VERSION already published, skipping"
          else
            npm publish --provenance --access public
          fi
