name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            node_modules
            packages/*/node_modules
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  test-core:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test core (excluding crypto)
        run: cd packages/core && bun vitest run --reporter=verbose --reporter=github-actions --exclude 'src/core/utils/ooxml-crypto.test.ts'

  test-core-crypto:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test core (ooxml-crypto)
        run: cd packages/core && bun vitest run --reporter=verbose --reporter=github-actions src/core/utils/ooxml-crypto.test.ts

  test-react:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test react
        run: cd packages/react && bun vitest run --reporter=verbose --reporter=github-actions

  test-emf-converter:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test emf-converter
        run: cd packages/emf-converter && bun vitest run --reporter=verbose --reporter=github-actions

  test-mtx-decompressor:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test mtx-decompressor
        run: cd packages/mtx-decompressor && bun vitest run --reporter=verbose --reporter=github-actions --passWithNoTests

  release:
    needs:
      [
        lint,
        typecheck,
        test-core,
        test-core-crypto,
        test-react,
        test-emf-converter,
        test-mtx-decompressor,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Determine next version
        id: version
        run: |
          # Find the highest existing v1.0.x tag
          LATEST_PATCH=$(git tag --list 'v1.0.*' --sort=-version:refname | head -n 1 | sed 's/v1\.0\.//')
          if [ -z "$LATEST_PATCH" ]; then
            NEXT_PATCH=1
          else
            NEXT_PATCH=$((LATEST_PATCH + 1))
          fi
          VERSION="1.0.${NEXT_PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${VERSION}"

      - name: Update package versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkgdir in packages/emf-converter packages/mtx-decompressor packages/core packages/react; do
            node -e "
              const fs = require('fs');
              const p = '${pkgdir}/package.json';
              const data = JSON.parse(fs.readFileSync(p, 'utf8'));
              data.version = '${VERSION}';
              fs.writeFileSync(p, JSON.stringify(data, null, '\t') + '\n');
            "
          done

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Pack emf-converter
        run: cd packages/emf-converter && bun pm pack

      - name: Pack mtx-decompressor
        run: cd packages/mtx-decompressor && bun pm pack

      - name: Pack pptx-viewer-core
        run: cd packages/core && bun pm pack

      - name: Pack pptx-viewer
        run: cd packages/react && bun pm pack

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            packages/emf-converter/*.tgz
            packages/mtx-decompressor/*.tgz
            packages/core/*.tgz
            packages/react/*.tgz
