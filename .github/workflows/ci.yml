name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Foundation: core + shared + mcp + cli (must all succeed) ────────────────
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      react-built: ${{ steps.build-react.outcome == 'success' }}
      vue-built: ${{ steps.build-vue.outcome == 'success' }}
      angular-built: ${{ steps.build-angular.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # Foundation packages: hard failure if any of these break.
      - name: Build foundation packages
        run: |
          bun run --filter 'pptx-viewer-core' build
          bun run --filter 'pptx-viewer-shared' build
          bun run --filter 'pptx-viewer-mcp' build
          bun run --filter '@christophervr/pptx-viewer' build

      # Framework bindings: each can fail independently without blocking others.
      - name: Build React
        id: build-react
        run: bun run --filter 'pptx-react-viewer' build
        continue-on-error: true

      - name: Build Vue
        id: build-vue
        run: bun run --filter 'pptx-vue-viewer' build
        continue-on-error: true

      - name: Build Angular
        id: build-angular
        run: bun run --filter 'pptx-angular-viewer' build
        continue-on-error: true

      # Abort the job only when ALL framework builds failed at once.
      - name: Require at least one framework built
        run: |
          if [ "${{ steps.build-react.outcome }}" = "failure" ] \
          && [ "${{ steps.build-vue.outcome }}" = "failure" ] \
          && [ "${{ steps.build-angular.outcome }}" = "failure" ]; then
            echo "All three framework builds failed."
            exit 1
          fi

      # Upload only the built dists (each job runs its own `bun install`, so
      # shipping node_modules around is pure waste). Partial dists are fine.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: packages/*/dist
          retention-days: 1

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

  typecheck:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The artifact holds packages/*/dist with `packages` as its root.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  # ── Tests: one matrix job per package ───────────────────────────────────────
  # Framework entries are enabled only when their build succeeded; a disabled
  # entry no-ops (every step is guarded) instead of failing the run.
  test:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: test-${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: core
            dir: packages/core
            cmd: bun vitest run --reporter=verbose --reporter=github-actions --exclude 'src/core/utils/ooxml-crypto.test.ts'
            enabled: 'true'
          - key: core-crypto
            dir: packages/core
            cmd: bun vitest run --reporter=verbose --reporter=github-actions src/core/utils/ooxml-crypto.test.ts
            enabled: 'true'
          - key: react
            dir: packages/react
            cmd: bun vitest run --reporter=verbose --reporter=github-actions
            enabled: ${{ needs.build.outputs.react-built }}
          - key: vue
            dir: packages/vue
            cmd: bun vitest run --reporter=verbose --reporter=github-actions
            enabled: ${{ needs.build.outputs.vue-built }}
          - key: angular
            dir: packages/angular
            # inline-shared vendors the shared source the Angular lib compiles against
            cmd: bun run inline-shared && bun vitest run --reporter=verbose --reporter=github-actions
            enabled: ${{ needs.build.outputs.angular-built }}
          - key: tools
            dir: packages/tools
            cmd: bun vitest run --reporter=verbose --reporter=github-actions
            enabled: 'true'
          - key: cli
            dir: packages/cli
            cmd: bun vitest run --reporter=verbose --reporter=github-actions
            enabled: 'true'
    steps:
      - uses: actions/checkout@v7
        if: matrix.enabled == 'true'

      - uses: actions/setup-node@v6
        if: matrix.enabled == 'true'
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        if: matrix.enabled == 'true'

      - name: Cache bun downloads
        if: matrix.enabled == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Download build artifacts
        if: matrix.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      - name: Install dependencies
        if: matrix.enabled == 'true'
        run: bun install

      - name: Test ${{ matrix.key }}
        if: matrix.enabled == 'true'
        run: cd ${{ matrix.dir }} && ${{ matrix.cmd }}
