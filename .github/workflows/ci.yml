name: CI

# Runs for pull requests from forks as well as from this repo. That is safe
# because no job here uses a secret: under the `pull_request` trigger a fork
# gets a read-only GITHUB_TOKEN and no access to repository secrets. Do not add
# a secret-consuming step to this file; put anything that needs one in a
# separate `pull_request_target` workflow that never checks out PR code (see
# pr-hygiene.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same PR are cancelled rather than left to finish, which
# matters most for the five-way e2e matrix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Scope ───────────────────────────────────────────────────────────────────
  # Decides which legs this run needs. Pushes to main always run everything;
  # only pull requests are scoped, and scoping errs towards running more (see
  # scripts/affected-packages.mjs).
  #
  # Playwright is the expensive part (a dev server plus a browser per
  # framework), so it is additionally skipped for pull requests from forks.
  # Maintainers get the full e2e sweep on the push to main, and can force it on
  # a fork PR by applying the `full-ci` label.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      test-legs: ${{ steps.scope.outputs.test-legs }}
      e2e-projects: ${{ steps.scope.outputs.e2e-projects }}
      has-tests: ${{ steps.scope.outputs.has-tests }}
      run-e2e: ${{ steps.gate.outputs.run-e2e }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo '[]' > changed-files.json
            echo "Push build: running the full matrix."
          else
            gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '[.[].filename]' | jq -s 'add // []' > changed-files.json
            echo "$(jq 'length' changed-files.json) changed file(s)."
          fi

      - name: Resolve affected legs
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo 'test-legs=["core","core-crypto","shared","locales","react","react18","vue","angular","vanilla","svelte","tools","cli"]'
              echo 'e2e-projects=["react","vue","angular","vanilla","svelte"]'
              echo 'has-tests=true'
            } >> "$GITHUB_OUTPUT"
          else
            node scripts/affected-packages.mjs changed-files.json
          fi

      - name: Decide whether e2e runs
        id: gate
        run: |
          fork="${{ github.event.pull_request.head.repo.fork }}"
          forced="${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}"
          has_e2e="${{ steps.scope.outputs.e2e-projects != '[]' }}"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
          elif [ "$has_e2e" != "true" ]; then
            echo "run-e2e=false" >> "$GITHUB_OUTPUT"
            echo "No binding or demo touched; skipping Playwright."
          elif [ "$fork" = "true" ] && [ "$forced" != "true" ]; then
            echo "run-e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Playwright is skipped for fork pull requests. It runs on the push to main, or add the \`full-ci\` label to force it here."
          else
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Foundation: core + shared + mcp + cli (must all succeed) ────────────────
  build:
    runs-on: ubuntu-latest
    outputs:
      react-built: ${{ steps.build-react.outcome == 'success' }}
      vue-built: ${{ steps.build-vue.outcome == 'success' }}
      angular-built: ${{ steps.build-angular.outcome == 'success' }}
      vanilla-built: ${{ steps.build-vanilla.outcome == 'success' }}
      svelte-built: ${{ steps.build-svelte.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # Foundation packages: hard failure if any of these break.
      # pptx-viewer-locales is demo-support: every demo app imports it, so the
      # e2e web servers 500 on startup when its dist is missing from the
      # artifact.
      - name: Build foundation packages
        run: |
          bun run --filter 'pptx-viewer-core' build
          bun run --filter 'pptx-viewer-shared' build
          bun run --filter 'pptx-viewer-locales' build
          bun run --filter 'pptx-viewer-mcp' build
          bun run --filter '@christophervr/pptx-viewer' build

      # Framework bindings: each can fail independently without blocking others.
      - name: Build React
        id: build-react
        run: bun run --filter 'pptx-react-viewer' build
        continue-on-error: true

      - name: Build Vue
        id: build-vue
        run: bun run --filter 'pptx-vue-viewer' build
        continue-on-error: true

      - name: Build Angular
        id: build-angular
        run: bun run --filter 'pptx-angular-viewer' build
        continue-on-error: true

      - name: Build Vanilla
        id: build-vanilla
        run: bun run --filter 'pptx-vanilla-viewer' build
        continue-on-error: true

      - name: Build Svelte
        id: build-svelte
        run: bun run --filter 'pptx-svelte-viewer' build
        continue-on-error: true

      # `continue-on-error` above is deliberate: it lets one run surface EVERY
      # broken binding rather than stopping at the first. It is not tolerance
      # for a broken binding. A failed build now fails that framework's `test`
      # and `e2e` legs (see the guard step in each), so the run still goes red
      # and `ci-success` still blocks the merge.
      - name: Summarise framework build outcomes
        if: always()
        run: |
          {
            echo "| Binding | Build |"
            echo "| --- | --- |"
            echo "| React | ${{ steps.build-react.outcome }} |"
            echo "| Vue | ${{ steps.build-vue.outcome }} |"
            echo "| Angular | ${{ steps.build-angular.outcome }} |"
            echo "| Vanilla | ${{ steps.build-vanilla.outcome }} |"
            echo "| Svelte | ${{ steps.build-svelte.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload only the built dists (each job runs its own `bun install`, so
      # shipping node_modules around is pure waste). Partial dists are fine.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: packages/*/dist
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      # Repo tooling that guards the contribution rules: the e2e neutrality
      # contract, the parity advisory, and the Conventional Commit validator.
      - name: Test repo scripts
        run: bun run test:scripts

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The artifact holds packages/*/dist with `packages` as its root.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  # ── Tests: one matrix leg per package ───────────────────────────────────────
  # The matrix is computed by the `scope` job, so a PR runs only the legs its
  # changed paths can reach. `packages/shared` and `packages/locales` legs exist
  # here because their suites (227 files, and the test that enforces locale key
  # parity) previously had no CI leg at all and never ran.
  test:
    needs: [scope, build]
    if: needs.scope.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    name: test-${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(needs.scope.outputs.test-legs) }}
    steps:
      # A leg whose binding failed to build used to skip every step and report
      # GREEN, so a binding could break outright while CI stayed clean. Fail
      # loudly: a check that runs nothing must never look like one that passed.
      - name: Require the build for this leg to have succeeded
        env:
          REACT_BUILT: ${{ needs.build.outputs.react-built }}
          VUE_BUILT: ${{ needs.build.outputs.vue-built }}
          ANGULAR_BUILT: ${{ needs.build.outputs.angular-built }}
          VANILLA_BUILT: ${{ needs.build.outputs.vanilla-built }}
          SVELTE_BUILT: ${{ needs.build.outputs.svelte-built }}
        run: |
          case "${{ matrix.key }}" in
            react|react18) built="$REACT_BUILT" ;;
            vue)           built="$VUE_BUILT" ;;
            angular)       built="$ANGULAR_BUILT" ;;
            vanilla)       built="$VANILLA_BUILT" ;;
            svelte)        built="$SVELTE_BUILT" ;;
            *)             built=true ;;
          esac
          if [ "$built" != "true" ]; then
            echo "::error::The build for ${{ matrix.key }} failed in the build job, so no tests could run here."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      - name: Install dependencies
        run: bun install

      # Leg -> directory and command. `core` is split from `core-crypto` because
      # the crypto suite is slow enough to deserve its own runner. `react18` is
      # the lower bound of the react/react-dom peer range (`^18.2.0 || ^19.0.0`,
      # issue #105): it re-runs the IDENTICAL specs with react/react-dom aliased
      # onto the React 18 pair owned by packages/react-compat, then type-checks a
      # consumer of the built declarations against @types/react 18, since the
      # .d.ts is generated with React 19 types and that pairing needs its own
      # proof. `angular` must vendor the shared source it compiles against first.
      - name: Resolve the command for this leg
        id: leg
        run: |
          # --coverage belongs INSIDE each command, not appended to the line: the
          # react18 leg chains `&& bun run typecheck:react18`, and appending sent
          # the flag to tsc (`TS5023: Unknown compiler option '--coverage'`).
          V="run --coverage --reporter=verbose --reporter=github-actions"
          case "${{ matrix.key }}" in
            core)        dir=packages/core;    cmd="bun vitest $V --exclude 'src/core/utils/ooxml-crypto.test.ts'" ;;
            core-crypto) dir=packages/core;    cmd="bun vitest $V src/core/utils/ooxml-crypto.test.ts" ;;
            shared)      dir=packages/shared;  cmd="bun vitest $V" ;;
            locales)     dir=packages/locales; cmd="bun vitest $V" ;;
            react)       dir=packages/react;   cmd="bun vitest $V" ;;
            react18)     dir=packages/react;   cmd="bun vitest run --coverage --config vitest.react18.config.ts --reporter=verbose --reporter=github-actions && bun run typecheck:react18" ;;
            vue)         dir=packages/vue;     cmd="bun vitest $V" ;;
            angular)     dir=packages/angular; cmd="bun run inline-shared && bun vitest $V" ;;
            vanilla)     dir=packages/vanilla; cmd="bun vitest $V" ;;
            svelte)      dir=packages/svelte;  cmd="bun vitest $V" ;;
            tools)       dir=packages/tools;   cmd="bun vitest $V" ;;
            cli)         dir=packages/cli;     cmd="bun vitest $V" ;;
            *) echo "::error::Unknown test leg ${{ matrix.key }}"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"

      - name: Test ${{ matrix.key }}
        run: cd ${{ steps.leg.outputs.dir }} && ${{ steps.leg.outputs.cmd }}

      # Per-package flags are what make coverage useful against the parity rule:
      # a UI change that moved only the `react` flag is a visible signal that the
      # other four bindings were not tested. Never fails the build; on fork PRs
      # the token is unavailable and Codecov falls back to tokenless upload.
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ${{ steps.leg.outputs.dir }}/coverage/coverage-final.json
          flags: ${{ matrix.key }}
          name: ${{ matrix.key }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── E2E: Playwright suite against each framework demo ───────────────────────
  # One matrix leg per framework, gated on that framework's own build like the
  # `test` job above. Every leg runs the identical product suite selected by
  # playwright.config.ts. Capture specs are documentation asset generators and
  # use playwright.capture.config.ts via `bun run docs:screenshots` instead.
  #
  # ribbon-tab-parity.spec.ts opens the React reference plus the binding owned
  # by each project so every framework retains the same no-wrap comparison.
  # `--workers=2` avoids saturating the single dev server per leg (observed
  # spurious timeouts/HMR contention with the default higher worker count
  # against one Vite dev server).
  #
  # The matrix comes from `scope`, which also decides whether this job runs at
  # all: Playwright is skipped for fork pull requests (add the `full-ci` label to
  # force it) and for PRs that touch no binding or demo.
  e2e:
    needs: [scope, build]
    if: needs.scope.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    name: e2e-${{ matrix.key }} (shard ${{ matrix.shard }}/3)
    # Hang protection only; genuine hangs are caught much earlier by
    # Playwright's own per-test timeout. This ceiling is per SHARD, not per
    # binding.
    #
    # Raising it is not the answer: it went 15 -> 25 on 2026-07-30, and the
    # suite has since grown from 129 tests to 291 (55 spec files -> 75). At the
    # observed per-test rate the react leg alone needs ~40 minutes of honest
    # work - it is the parity REFERENCE, so its parity specs sweep all five
    # demos. Splitting each binding three ways keeps a shard near 15 minutes as
    # the suite keeps growing, instead of ratcheting this number every fortnight.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(needs.scope.outputs.e2e-projects) }}
        shard: [1, 2, 3]
    steps:
      # See the equivalent guard in `test`: a skipped leg must not report green.
      - name: Require the ${{ matrix.key }} build to have succeeded
        env:
          REACT_BUILT: ${{ needs.build.outputs.react-built }}
          VUE_BUILT: ${{ needs.build.outputs.vue-built }}
          ANGULAR_BUILT: ${{ needs.build.outputs.angular-built }}
          VANILLA_BUILT: ${{ needs.build.outputs.vanilla-built }}
          SVELTE_BUILT: ${{ needs.build.outputs.svelte-built }}
        run: |
          case "${{ matrix.key }}" in
            react)   built="$REACT_BUILT" ;;
            vue)     built="$VUE_BUILT" ;;
            angular) built="$ANGULAR_BUILT" ;;
            vanilla) built="$VANILLA_BUILT" ;;
            svelte)  built="$SVELTE_BUILT" ;;
            *)       built=true ;;
          esac
          if [ "$built" != "true" ]; then
            echo "::error::The ${{ matrix.key }} build failed in the build job, so no e2e could run here."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The React and Vue demo dev servers alias bare `pptx-viewer-core` /
      # `pptx-*-viewer` specifiers straight to package *source* (see
      # demos/demo-{react,vue}/vite.config.ts), so they don't need those dists
      # at all - but React does NOT alias the bare `pptx-viewer-shared`
      # specifier, and the e2e fixture generator (e2e/global-setup.ts) imports
      # `pptx-viewer-core` directly under plain Node, so core + shared's dist
      # are required regardless of which framework leg is running (vanilla and
      # svelte alias straight to source too, per
      # demos/demo-{vanilla,svelte}/vite.config.ts, same as React/Vue).
      # Angular's
      # demo aliases straight to its own built dist (ng-packagr output), so it
      # needs its dist too. All of this already sits in the `build` job's
      # artifact.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bun run e2e:install

      - name: Run e2e (${{ matrix.key }} shard ${{ matrix.shard }}/3)
        run: bun run e2e -- --project=${{ matrix.key }} --shard=${{ matrix.shard }}/3 --workers=2 --reporter=list,html,github

      # Failures used to be visible only by downloading an artifact, which meant
      # nobody looked. Put the failing spec names in the run summary instead.
      - name: Summarise e2e failures
        if: failure()
        run: |
          {
            echo "### e2e failures (${{ matrix.key }} shard ${{ matrix.shard }}/3)"
            echo ""
            if [ -f test-results/.last-run.json ]; then
              echo '```'
              node -e "const r=require('./test-results/.last-run.json');(r.failedTests||[]).forEach(t=>console.log(t));" || true
              echo '```'
            fi
            echo "Full HTML report: see the \`playwright-report-${{ matrix.key }}-${{ matrix.shard }}\` artifact on this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.key }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Production-build smoke ─────────────────────────────────────────────────
  # The `e2e` matrix above runs against demo DEV servers, which serve unbundled
  # source. That can never catch a defect the BUNDLER introduces, and the
  # deployed GitHub Pages demos are bundles. A slide show whose keyframes
  # constant got tree-shaken out renders perfectly and animates nothing, which
  # is exactly the shape of failure that can ship green.
  #
  # So build every demo the way `docs.yml` does (library dists first, demo dist
  # second) and run `e2e/packaged-present.spec.ts` against `vite preview` over
  # each built dist. One job for all five: the specs are short and the demo
  # builds dominate the wall clock.
  e2e-packaged:
    needs: [scope, build]
    if: needs.scope.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    name: e2e-packaged
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Same dists the deploy consumes: the Angular demo resolves its binding
      # AND core from `dist`, and every demo needs the locales dist.
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: packages

      - name: Install dependencies
        run: bun install

      # A binding whose library build failed above cannot produce a demo dist,
      # and a missing dist would make `vite preview` 404 rather than fail loudly.
      - name: Require every binding to have built
        env:
          REACT_BUILT: ${{ needs.build.outputs.react-built }}
          VUE_BUILT: ${{ needs.build.outputs.vue-built }}
          ANGULAR_BUILT: ${{ needs.build.outputs.angular-built }}
          VANILLA_BUILT: ${{ needs.build.outputs.vanilla-built }}
          SVELTE_BUILT: ${{ needs.build.outputs.svelte-built }}
        run: |
          for pair in "react:$REACT_BUILT" "vue:$VUE_BUILT" "angular:$ANGULAR_BUILT" \
                      "vanilla:$VANILLA_BUILT" "svelte:$SVELTE_BUILT"; do
            if [ "${pair#*:}" != "true" ]; then
              echo "::error::The ${pair%%:*} binding failed to build, so its packaged demo cannot be smoke-tested."
              exit 1
            fi
          done

      - name: Build demo bundles
        run: |
          bun run --filter 'pptx-react-demo' build
          bun run --filter 'pptx-vue-demo' build
          bun run --filter 'pptx-angular-demo' build
          bun run --filter 'pptx-vanilla-demo' build
          bun run --filter 'pptx-svelte-demo' build

      - name: Install Playwright browsers
        run: bun run e2e:install

      - name: Run packaged-build smoke
        run: bun run e2e:packaged -- --workers=2 --reporter=list,html,github

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-packaged
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Merge gate ──────────────────────────────────────────────────────────────
  # The single check the `main` ruleset requires. Matrix legs change names as
  # bindings come and go, and a required check that no longer exists blocks
  # every PR silently; funnelling through one job keeps branch protection stable.
  #
  # `always()` plus the explicit result test is deliberate: without it a
  # cancelled or skipped dependency would let this pass.
  ci-success:
    name: ci-success
    if: always()
    needs: [scope, build, lint, typecheck, test, e2e, e2e-packaged]
    runs-on: ubuntu-latest
    steps:
      # `skipped` is accepted because `scope` legitimately drops legs a PR
      # cannot affect (a docs-only change runs no tests; a fork PR runs no
      # Playwright). That is NOT the old failure mode: back then a leg was
      # skipped *because its build had failed* and still reported green. Now a
      # skip is a deliberate decision made up front, and a leg that starts and
      # cannot run its tests fails instead. `cancelled` and `failure` are still
      # hard failures here.
      - name: Check every required job succeeded or was deliberately skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A required CI job did not succeed (got: $results)."
                exit 1
                ;;
            esac
          done
          echo "All required CI jobs succeeded or were deliberately skipped."
