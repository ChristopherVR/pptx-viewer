name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Foundation: emf-converter + core + shared + mcp (must all succeed) ──────
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      react-built: ${{ steps.build-react.outcome == 'success' }}
      vue-built: ${{ steps.build-vue.outcome == 'success' }}
      angular-built: ${{ steps.build-angular.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Foundation packages — hard failure if any of these break.
      - name: Build foundation packages
        run: |
          bun run --filter 'pptx-viewer-core' build
          bun run --filter 'pptx-viewer-shared' build
          bun run --filter 'pptx-viewer-mcp' build
          bun run --filter '@christophervr/pptx-viewer' build

      # Framework bindings — each can fail independently without blocking others.
      - name: Build React
        id: build-react
        run: bun run --filter 'pptx-react-viewer' build
        continue-on-error: true

      - name: Build Vue
        id: build-vue
        run: bun run --filter 'pptx-vue-viewer' build
        continue-on-error: true

      - name: Build Angular
        id: build-angular
        run: bun run --filter 'pptx-angular-viewer' build
        continue-on-error: true

      # Abort the job only when ALL framework builds failed at once.
      - name: Require at least one framework built
        run: |
          if [ "${{ steps.build-react.outcome }}" = "failure" ] \
          && [ "${{ steps.build-vue.outcome }}" = "failure" ] \
          && [ "${{ steps.build-angular.outcome }}" = "failure" ]; then
            echo "All three framework builds failed."
            exit 1
          fi

      # Upload whatever was built — partial artifacts are fine for test jobs.
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist
            node_modules
            packages/*/node_modules
          retention-days: 1

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

  typecheck:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  test-core:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test core (excluding crypto)
        run: cd packages/core && bun vitest run --reporter=verbose --reporter=github-actions --exclude 'src/core/utils/ooxml-crypto.test.ts'

  test-core-crypto:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test core (ooxml-crypto)
        run: cd packages/core && bun vitest run --reporter=verbose --reporter=github-actions src/core/utils/ooxml-crypto.test.ts

  test-react:
    needs: build
    # Only run if the React build succeeded.
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.build.outputs.react-built == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test react
        run: cd packages/react && bun vitest run --reporter=verbose --reporter=github-actions

  test-tools:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test tools
        run: cd packages/tools && bun vitest run --reporter=verbose --reporter=github-actions

  test-cli:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test @christophervr/pptx-viewer
        run: cd packages/cli && bun vitest run --reporter=verbose --reporter=github-actions

  test-vue:
    needs: build
    # Only run if the Vue build succeeded.
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.build.outputs.vue-built == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test vue
        run: cd packages/vue && bun vitest run --reporter=verbose --reporter=github-actions

  test-angular:
    needs: build
    # Only run if the Angular build succeeded.
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.build.outputs.angular-built == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install dependencies
        run: bun install

      - name: Test angular
        # inline-shared vendors the shared source the Angular lib compiles against
        run: cd packages/angular && bun run inline-shared && bun vitest run --reporter=verbose --reporter=github-actions
