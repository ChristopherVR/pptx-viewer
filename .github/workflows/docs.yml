name: Deploy Docs + Demo to GitHub Pages

on:
  # Docs-only edits deploy immediately. Package/demo changes deploy via an
  # explicit dispatch from the Release workflow (only when something was
  # actually released), so the public demos always correspond to the latest
  # published packages without redeploying on every no-op scheduled run.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # Manual runs from the Actions tab; also dispatched by release.yml.
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping queued runs in between
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for lastUpdated git timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build docs with VitePress
        run: bun run docs:build

      # Build foundation packages first (hard failure — everything else depends on them).
      - name: Build foundation packages
        run: |
          bun run --filter 'pptx-viewer-core' build
          bun run --filter 'pptx-viewer-shared' build
          bun run --filter 'pptx-viewer-mcp' build

      # Build each framework binding independently. A binding failure means its
      # demo is skipped but the others still deploy.
      - name: Build React
        id: build-react
        run: bun run --filter 'pptx-react-viewer' build
        continue-on-error: true

      - name: Build Vue
        id: build-vue
        run: bun run --filter 'pptx-vue-viewer' build
        continue-on-error: true

      - name: Build Angular
        id: build-angular
        run: bun run --filter 'pptx-angular-viewer' build
        continue-on-error: true

      # Build each demo; skip silently if its library did not build.
      # VITE_COLLAB_SERVER_URL (optional repo variable COLLAB_SERVER_URL) points
      # the deployed demos at a hosted wss:// y-websocket relay. Without it the
      # demos fall back to serverless peer-to-peer (y-webrtc) collaboration,
      # which works from static hosting.
      - name: Build React demo
        if: steps.build-react.outcome == 'success'
        run: bun run --filter 'pptx-react-demo' build
        continue-on-error: true
        env:
          DEMO_BASE: /pptx-viewer/demo/
          VITE_COLLAB_SERVER_URL: ${{ vars.COLLAB_SERVER_URL }}

      - name: Build Vue demo
        if: steps.build-vue.outcome == 'success'
        run: bun run --filter 'pptx-vue-demo' build
        continue-on-error: true
        env:
          DEMO_BASE: /pptx-viewer/demo-vue/
          VITE_COLLAB_SERVER_URL: ${{ vars.COLLAB_SERVER_URL }}

      - name: Build Angular demo
        if: steps.build-angular.outcome == 'success'
        run: bun run --filter 'pptx-angular-demo' build
        continue-on-error: true
        env:
          DEMO_BASE: /pptx-viewer/demo-angular/
          VITE_COLLAB_SERVER_URL: ${{ vars.COLLAB_SERVER_URL }}

      # Fold whichever demos succeeded into the docs artifact. Missing dists are
      # skipped gracefully so the page still deploys with whatever is available.
      - name: Bundle demos into docs site
        run: |
          for demo in react:demo vue:demo-vue angular:demo-angular; do
            framework="${demo%%:*}"
            src="demos/demo-${framework}/dist"
            dest="docs/.vitepress/dist/${demo##*:}"
            if [ -d "$src" ]; then
              mkdir -p "$dest"
              cp -r "$src/." "$dest/"
              cp "$dest/index.html" "$dest/404.html"
            else
              echo "Skipping ${framework} demo (dist not found)"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
