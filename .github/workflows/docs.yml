name: Deploy Docs + Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'demos/demo-react/**'
      - 'packages/**'
      - '.github/workflows/docs.yml'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping queued runs in between
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for lastUpdated git timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build docs with VitePress
        run: bun run docs:build

      # Builds the workspace packages and the React demo. DEMO_BASE makes the
      # demo's asset URLs resolve under the Pages subpath it is served from.
      - name: Build packages + React demo
        run: bun run build
        env:
          DEMO_BASE: /pptx-viewer/demo/

      # Fold the demo into the docs artifact so both ship as one Pages site.
      # The 404.html copy lets the demo's client-side routing survive deep links.
      - name: Bundle demo into docs site
        run: |
          mkdir -p docs/.vitepress/dist/demo
          cp -r demos/demo-react/dist/. docs/.vitepress/dist/demo/
          cp docs/.vitepress/dist/demo/index.html docs/.vitepress/dist/demo/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
