name: Deploy Docs + Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'demos/demo-react/**'
      - 'demos/demo-vue/**'
      - 'demos/demo-angular/**'
      - 'packages/**'
      - '.github/workflows/docs.yml'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping queued runs in between
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # needed for lastUpdated git timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build docs with VitePress
        run: bun run docs:build

      # Builds the workspace packages and the React demo. DEMO_BASE makes the
      # demo's asset URLs resolve under the Pages subpath it is served from.
      - name: Build packages + React demo
        run: bun run build
        env:
          DEMO_BASE: /pptx-viewer/demo/

      # The Vue and Angular demos ship as their own Pages subpaths so each
      # binding's README can link a "Try demo" for that framework specifically.
      # They build after the workspace build above, which produces the library
      # dist the Angular demo aliases against.
      - name: Build Vue demo
        run: bun run --filter 'pptx-vue-demo' build
        env:
          DEMO_BASE: /pptx-viewer/demo-vue/

      - name: Build Angular demo
        run: bun run --filter 'pptx-angular-demo' build
        env:
          DEMO_BASE: /pptx-viewer/demo-angular/

      # Fold the demos into the docs artifact so they ship as one Pages site.
      # Each gets a 404.html copy so the demo's client-side routing survives
      # deep links under its subpath.
      - name: Bundle demos into docs site
        run: |
          for demo in react:demo vue:demo-vue angular:demo-angular; do
            src="demos/demo-${demo%%:*}/dist"
            dest="docs/.vitepress/dist/${demo##*:}"
            mkdir -p "$dest"
            cp -r "$src/." "$dest/"
            cp "$dest/index.html" "$dest/404.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
