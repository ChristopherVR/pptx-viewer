name: Prune releases

# Release retention: keep only the newest version per published package
# (tagged `<npm-name>@x.y.z`) and delete the older GitHub Release entries, so
# the Releases page reads as a "current version of every package" list. Git
# tags are kept (opt in to deleting them via the `tags` input); npm versions
# are never touched. See scripts/prune-releases.mjs. The release workflow also
# prunes right after tagging; this scheduled run is the backstop.

on:
  schedule:
    # Daily, 04:30 UTC (releases run hourly, so tags accumulate quickly).
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Number of newest releases to keep per package'
        required: false
        default: '1'
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        required: false
        default: false
      tags:
        description: "Also delete the pruned versions' git tags"
        type: boolean
        required: false
        default: false
      legacy:
        description: 'Also delete retired global v* releases/tags'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="${{ github.event.inputs.keep || '1' }}"
          flags=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            flags="$flags --dry-run"
          fi
          if [ "${{ github.event.inputs.tags }}" = "true" ]; then
            flags="$flags --tags"
          fi
          if [ "${{ github.event.inputs.legacy }}" = "true" ]; then
            flags="$flags --legacy"
          fi
          node scripts/prune-releases.mjs --keep "$keep" $flags
