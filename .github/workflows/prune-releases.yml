name: Prune releases

# Retention for releases AND tags: keep only the newest N versions per
# published package (tagged `<npm-name>@x.y.z`) and delete both the older
# GitHub Release entries and their git tags. Safe because changelogs are
# prepend-only and release-plan.mjs only reads each package's newest tags.
# npm versions are never touched. See scripts/prune-releases.mjs.

on:
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Number of newest versions (release + tag) to keep per package'
        required: false
        default: '5'
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        required: false
        default: false
      legacy:
        description: 'Also delete retired global v* tags'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prune old releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="${{ github.event.inputs.keep || '5' }}"
          flags=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            flags="$flags --dry-run"
          fi
          if [ "${{ github.event.inputs.legacy }}" = "true" ]; then
            flags="$flags --legacy"
          fi
          node scripts/prune-releases.mjs --keep "$keep" $flags
