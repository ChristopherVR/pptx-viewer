<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">pptx-viewer-core load, edit, and save pipeline</title>
  <desc id="desc">A PowerPoint file is parsed into a typed data model, changed through the core API, and serialized back to PowerPoint or converted to other formats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="58" y="62" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="16" letter-spacing="2">PPTX-VIEWER-CORE / HEADLESS PIPELINE</text>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif">
    <g transform="translate(58 112)"><rect width="220" height="230" rx="18" fill="#fff"/><rect x="28" y="32" width="70" height="82" rx="8" fill="#f04438"/><text x="50" y="83" fill="#fff" font-size="28" font-weight="700">P</text><text x="28" y="153" fill="#111827" font-size="23" font-weight="700">deck.pptx</text><text x="28" y="184" fill="#64748b" font-size="15">OpenXML + media ZIP</text></g>
    <g transform="translate(344 112)"><rect width="250" height="230" rx="18" fill="#202c40" stroke="#475569"/><text x="28" y="50" fill="#f8fafc" font-size="21" font-weight="700">PptxHandler.load()</text><text x="28" y="89" fill="#94a3b8" font-size="15">parse XML</text><text x="28" y="119" fill="#94a3b8" font-size="15">resolve themes</text><text x="28" y="149" fill="#94a3b8" font-size="15">masters + layouts</text><text x="28" y="190" fill="#38bdf8" font-family="ui-monospace,monospace" font-size="15">ArrayBuffer -&gt; PptxData</text></g>
    <g transform="translate(658 92)"><rect width="250" height="270" rx="18" fill="#fff"/><text x="28" y="48" fill="#111827" font-size="21" font-weight="700">Typed slide model</text><g fill="#e2e8f0"><rect x="28" y="76" width="194" height="34" rx="7"/><rect x="28" y="120" width="154" height="34" rx="7"/><rect x="28" y="164" width="181" height="34" rx="7"/></g><text x="42" y="99" fill="#334155" font-family="ui-monospace,monospace" font-size="14">text | shape | image</text><text x="42" y="143" fill="#334155" font-family="ui-monospace,monospace" font-size="14">chart | table</text><text x="42" y="187" fill="#334155" font-family="ui-monospace,monospace" font-size="14">smartArt | media</text><text x="28" y="235" fill="#f04438" font-size="15" font-weight="650">Create. Edit. Inspect.</text></g>
    <g transform="translate(972 112)"><rect width="170" height="230" rx="18" fill="#202c40" stroke="#475569"/><text x="24" y="48" fill="#f8fafc" font-size="19" font-weight="700">Output</text><text x="24" y="92" fill="#38bdf8" font-size="16">.pptx</text><text x="24" y="125" fill="#a7f3d0" font-size="16">Markdown</text><text x="24" y="158" fill="#fde68a" font-size="16">HTML / SVG</text><text x="24" y="202" fill="#94a3b8" font-size="14">Node or browser</text></g>
  </g>
  <g fill="none" stroke="#f04438" stroke-width="4" stroke-linecap="round"><path d="M292 227h34"/><path d="m320 219 8 8-8 8"/><path d="M608 227h32"/><path d="m634 219 8 8-8 8"/><path d="M922 227h32"/><path d="m948 219 8 8-8 8"/></g>
