<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">AI agent editing a PowerPoint through pptx-viewer-mcp</title>
  <desc id="desc">An agent requests a text replacement, the MCP server validates and executes the tool, and saves a changed PowerPoint file.</desc>
  <rect width="1200" height="430" rx="28" fill="#0b1220"/>
  <g font-family="system-ui,sans-serif">
    <text x="55" y="58" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="15" letter-spacing="2">PPTX-VIEWER-MCP / AGENT TO PRESENTATION</text>
    <g transform="translate(55 100)"><rect width="320" height="255" rx="20" fill="#172033" stroke="#334155"/><circle cx="46" cy="48" r="18" fill="#38bdf8"/><text x="78" y="55" fill="#fff" font-size="20" font-weight="700">AI agent</text><rect x="28" y="90" width="264" height="86" rx="14" fill="#223049"/><text x="48" y="122" fill="#e2e8f0" font-size="16">"Replace Draft with Final</text><text x="48" y="148" fill="#e2e8f0" font-size="16">and add a summary slide."</text><text x="28" y="218" fill="#38bdf8" font-family="ui-monospace,monospace" font-size="14">MCP client</text></g>
    <g transform="translate(440 78)"><rect width="330" height="300" rx="22" fill="#fff"/><text x="30" y="52" fill="#111827" font-size="23" font-weight="750">pptx-viewer-mcp</text><text x="30" y="83" fill="#64748b" font-size="15">validated tools over stdio</text><g font-family="ui-monospace,monospace" font-size="14"><rect x="30" y="112" width="270" height="38" rx="8" fill="#e0f2fe"/><text x="47" y="136" fill="#075985">replace_text</text><rect x="30" y="160" width="270" height="38" rx="8" fill="#dcfce7"/><text x="47" y="184" fill="#166534">add_slide</text><rect x="30" y="208" width="270" height="38" rx="8" fill="#fef3c7"/><text x="47" y="232" fill="#92400e">run_accessibility_check</text></g><text x="30" y="280" fill="#f04438" font-size="14" font-weight="700">load - edit - save</text></g>
    <g transform="translate(835 100)"><rect width="310" height="255" rx="20" fill="#172033" stroke="#334155"/><rect x="28" y="34" width="82" height="98" rx="10" fill="#f04438"/><text x="57" y="94" fill="#fff" font-size="32" font-weight="800">P</text><text x="132" y="70" fill="#fff" font-size="20" font-weight="700">deck.pptx</text><text x="132" y="100" fill="#94a3b8" font-size="15">saved in place</text><g fill="#a7f3d0" font-size="16"><text x="28" y="177">✓ 12 replacements</text><text x="28" y="207">✓ 1 slide added</text><text x="28" y="237">✓ valid OpenXML</text></g></g>
  </g>
  <g stroke="#f04438" stroke-width="4" fill="none" stroke-linecap="round"><path d="M390 228h32"/><path d="m416 220 8 8-8 8"/><path d="M786 228h32"/><path d="m812 220 8 8-8 8"/></g>
</svg>
