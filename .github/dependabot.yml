version: 2

updates:
  # ── JavaScript / TypeScript dependencies (Bun workspaces) ──
  # Dependabot reads bun.lock and the workspace package.json files.
  # "/" picks up the root and every package via the workspaces field.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Africa/Johannesburg'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - 'dependencies'
    # No `include: scope` here: the prefixes below already carry the scope, and
    # setting both produced doubled subjects like
    # `chore(deps-dev)(deps-dev): Update happy-dom requirement`.
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # Batch low-risk minor/patch bumps into a single PR to cut noise.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      # Keep the React ecosystem moving together.
      react:
        applies-to: version-updates
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # Keep type-only definitions grouped.
      types:
        applies-to: version-updates
        patterns:
          - '@types/*'
    ignore:
      # Major version bumps tend to be breaking for these - review manually.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is a deliberate partial migration, not a bump to automate.
      # react/cli/tools/vanilla/core/shared/locales are on TS7; angular, vue,
      # svelte and the demos are pinned to 6.0.3 because their toolchains cannot
      # take it: @angular/compiler-cli declares `typescript: ">=6.0 <6.1"`, and
      # vue-tsc / svelte-check crash on TS7 despite advertising `>=5.0.0`.
      # Dependabot proposed exactly the blocked set in #112. Revisit by checking
      # those three upstreams first, not by merging a bump.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # ── GitHub Actions used in workflows ──
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Africa/Johannesburg'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    # As above: the prefix already carries the scope.
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
