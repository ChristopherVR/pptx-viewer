# git-cliff configuration for the root consolidated CHANGELOG.md.
#
# Extends cliff.toml but uses a tag_pattern that covers BOTH the legacy
# global v* tags (v1.x.y) and the current per-package tags
# (pptx-viewer-core@x.y.z, pptx-react-viewer@x.y.z, etc.).
#
# Used by:
#   bun run changelog             # regenerate CHANGELOG.md
#   bun run changelog:unreleased  # preview unreleased commits
#
# The Release workflow also runs `bunx git-cliff --config cliff-root.toml`
# after cutting per-package tags so the root file stays up to date.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated from [Conventional Commits](https://www.conventionalcommits.org)
by [git-cliff](https://git-cliff.org); do not edit it by hand.\n
"""
body = """
{% set repo = "https://github.com/ChristopherVR/pptx-viewer" %}\
{% if version %}\
    ## [{{ version | split(pat="@") | last | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.username %} (by @{{ commit.remote.username }}){% endif %}\
            {% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }})){% endif %}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = [
	{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/ChristopherVR/pptx-viewer/issues/${2}))" },
]

commit_parsers = [
	# Skip the CI changelog-update commits FIRST (before any type-based grouping).
	# These commits touch packages/*/CHANGELOG.md and CHANGELOG.md, so git-cliff
	# includes them; skipping here prevents them polluting every release section.
	{ message = "\\[skip ci\\]", skip = true },
	{ message = "^chore\\(release\\)", skip = true },
	{ message = "^feat", group = "<!-- 0 -->Features" },
	{ message = "^fix", group = "<!-- 1 -->Bug Fixes" },
	{ message = "^perf", group = "<!-- 2 -->Performance" },
	{ message = "^refactor", group = "<!-- 3 -->Refactor" },
	{ message = "^docs", group = "<!-- 4 -->Documentation" },
	{ message = "^test", group = "<!-- 5 -->Testing" },
	{ message = "^(build|ci)", group = "<!-- 6 -->Build & CI" },
	{ message = "^style", group = "<!-- 7 -->Styling" },
	{ message = "^chore\\(deps\\)", group = "<!-- 8 -->Dependencies" },
	{ message = "^chore", group = "<!-- 9 -->Chores" },
	{ message = "^revert", group = "<!-- 10 -->Reverts" },
	{ body = ".*security", group = "<!-- 11 -->Security" },
	{ message = ".*", group = "<!-- 12 -->Other" },
]

filter_commits = false
protect_breaking_commits = false
topo_order = false
sort_commits = "oldest"
# Cover both the legacy global v* tags and the current per-package tags.
# This keeps the root CHANGELOG.md growing as new per-package releases are cut.
tag_pattern = "^(pptx-[a-z-]+@|v)[0-9]"
skip_tags = ""
ignore_tags = ""

[remote.github]
owner = "ChristopherVR"
repo = "pptx-viewer"
