<!-- Backdrop -->
<div class="pptx-ng-sorter-backdrop" (click)="onBackdropClick($event)">
	<!-- Modal panel -->
	<div class="pptx-ng-sorter-panel" (click)="$event.stopPropagation()">
		<!-- Header -->
		<header class="pptx-ng-sorter-header">
			<h2 class="pptx-ng-sorter-title">{{ 'pptx.slideSorter.title' | translate }}</h2>
			<span class="pptx-ng-sorter-count">{{
				'pptx.slideSorter.slideCount' | translate: { count: slides().length }
			}}</span>
			<button
				type="button"
				class="pptx-ng-sorter-close"
				[attr.aria-label]="'pptx.slideSorter.close' | translate"
				(click)="closed.emit()"
			>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="16"
					height="16"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
				>
					<line x1="18" y1="6" x2="6" y2="18" />
					<line x1="6" y1="6" x2="18" y2="18" />
				</svg>
			</button>
		</header>

		<!-- Scrollable grid -->
		<div class="pptx-ng-sorter-grid-scroll">
			<div class="pptx-ng-sorter-grid" [ngStyle]="gridStyle()">
				@for (slide of slides(); track slide.id; let i = $index) {
					@let hidden = hiddenCue(slide, i);
					<button
						type="button"
						class="pptx-ng-sorter-cell"
						[class.is-active]="i === activeIndex()"
						[class.is-hidden]="hidden.hidden"
						[attr.data-pptx-slide-hidden]="hidden.marker ?? null"
						[attr.aria-label]="'pptx.notes.slideN' | translate: { n: i + 1 }"
						[attr.aria-describedby]="hidden.labelId ?? null"
						[attr.aria-current]="i === activeIndex() ? 'true' : null"
						(click)="onThumbClick(i)"
						(contextmenu)="onThumbContextMenu($event, i)"
					>
						<!-- Thumbnail clipping wrapper -->
						<div class="pptx-ng-sorter-thumb-clip" [ngStyle]="clipStyle()">
							<pptx-slide-canvas
								[slide]="slide"
								[canvasSize]="canvasSize()"
								[mediaDataUrls]="mediaDataUrls()"
								[zoom]="thumbZoom()"
								[autoFit]="false"
								[interactive]="false"
								[exposeElementIds]="false"
							/>
						</div>
						<!-- Slide number badge, struck through with the shared diagonal
						     slash when hidden (PowerPoint's own cue). -->
						<span
							class="pptx-ng-sorter-index"
							aria-hidden="true"
							[style.background-image]="hidden.hidden ? slashGradient : null"
							>{{ i + 1 }}</span
						>
						@if (hidden.hidden) {
							<span class="pptx-ng-sorter-hidden" [id]="hidden.labelId">{{
								hiddenLabelKey | translate
							}}</span>
						}
					</button>
				}
			</div>
		</div>
	</div>

	@if (contextMenu(); as menu) {
		<button
			type="button"
			class="pptx-ng-sorter-menu-backdrop"
			[attr.aria-label]="'pptx.overflow.closeMenu' | translate"
			(click)="closeContextMenu()"
			(contextmenu)="$event.preventDefault(); closeContextMenu()"
		></button>
		<div
			class="pptx-ng-sorter-context-menu"
			[style.left.px]="menu.x"
			[style.top.px]="menu.y"
			role="menu"
		>
			<button type="button" role="menuitem" (click)="menuDuplicate()">
				{{ 'pptx.slideMenu.duplicate' | translate }}
			</button>
			<button type="button" role="menuitem" (click)="menuToggleHidden()">
				{{
					(contextMenuTargetHidden() ? 'pptx.slideMenu.show' : 'pptx.slideMenu.hide') | translate
				}}
			</button>
			<div class="pptx-ng-sorter-context-menu-sep"></div>
			<button type="button" role="menuitem" class="is-danger" (click)="menuDelete()">
				{{ 'pptx.slideMenu.delete' | translate }}
			</button>
		</div>
	}
</div>
