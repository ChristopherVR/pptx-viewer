<div
	#wrapper
	class="pptx-ng-chart-view"
	[class.pptx-chart-interactive]="canEdit()"
	(pointerdown)="onPointerDown($event)"
	(pointermove)="onPointerMove($event)"
	(pointerup)="onPointerUp()"
	(dblclick)="onDblClick($event)"
>
	@if (threeSpec(); as spec) {
		<pptx-ng-three-view
			[spec]="spec"
			[interactive]="canEdit()"
			[selectedPart]="selectedPart()"
			[textStyle]="chartTextStyle()"
			(partSelect)="onChartPart3DSelect($event)"
			(valueDrag)="onChart3DValueDrag($event)"
		>
			<pptx-chart-renderer [element]="renderedElement()" />
		</pptx-ng-three-view>
	} @else {
		<pptx-chart-renderer [element]="renderedElement()" />
	}
	@if (dragValue() !== null) {
		<div class="pptx-ng-chart-drag-badge">{{ dragBadge() }}</div>
	}
	@if (titleDraft() !== null) {
		<input
			#titleEditor
			type="text"
			class="pptx-ng-chart-title-input"
			[value]="titleDraft() ?? ''"
			(input)="onTitleInput($event)"
			(keydown)="onTitleKeydown($event)"
			(blur)="commitTitle()"
			(pointerdown)="$event.stopPropagation()"
			(dblclick)="$event.stopPropagation()"
		/>
	}
</div>
