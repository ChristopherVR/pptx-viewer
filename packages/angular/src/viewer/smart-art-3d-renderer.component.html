@if (useFallback()) {
	<!--
		The SVG renderer only fills a box, so the positioned, id-bearing,
		marked element node has to be drawn here.
	-->
	<div
		class="pptx-ng-element pptx-ng-smartart"
		[ngStyle]="containerStyle()"
		[attr.data-element-id]="element().id"
		[attr.data-pptx-element]="markElement() ? 'true' : null"
	>
		<!-- Interaction-only hit target for a degenerate SmartArt; see `hitTargetStyle`. -->
		@if (hitTargetStyle(); as hit) {
			<div aria-hidden="true" data-pptx-hit-target="true" [ngStyle]="hit"></div>
		}
		<pptx-smart-art-renderer [element]="element()" />
	</div>
} @else {
	<div
		#container3d
		class="pptx-ng-element pptx-ng-smartart-3d"
		[ngStyle]="containerStyle()"
		[attr.data-element-id]="element().id"
		[attr.data-pptx-element]="markElement() ? 'true' : null"
	>
		<!-- Interaction-only hit target for a degenerate SmartArt; see `hitTargetStyle`. -->
		@if (hitTargetStyle(); as hit) {
			<div aria-hidden="true" data-pptx-hit-target="true" [ngStyle]="hit"></div>
		}
		<pptx-ng-three-view [spec]="spec()" [interactive]="canEdit()" [textStyle]="textStyle()">
			<pptx-smart-art-renderer [element]="element()" />
		</pptx-ng-three-view>
		@if (canEdit()) {
			<!-- Invisible SVG overlay: provides data-smartart-node-id hit targets -->
			<div
				class="pptx-ng-smartart-3d-hittest"
				(dblclick)="onOverlayDblClick($event)"
				(mousemove)="onOverlayMouseMove($event)"
				(mouseleave)="onHoverLeave($event)"
			>
				<pptx-smart-art-renderer [element]="element()" [editable]="false" />
			</div>
			@if (hoveredNodeId() && !editState() && styleBarStyle()) {
				<!-- Per-node fill colour picker (hover swatch bar), as on the 2D diagram -->
				<div
					class="pptx-ng-smartart-3d-style-bar"
					[ngStyle]="styleBarStyle()!"
					(mousedown)="$event.stopPropagation()"
					(click)="$event.stopPropagation()"
					(mouseleave)="onHoverLeave($event)"
				>
					@for (color of palette().slice(0, 6); track color) {
						<button
							type="button"
							class="pptx-ng-smartart-3d-swatch"
							data-pptx-compact
							[attr.aria-label]="'pptx.smartArt.setFill' | translate: { color: color }"
							[style.background]="color"
							(click)="handleChangeNodeStyle(hoveredNodeId()!, color)"
						></button>
					}
				</div>
			}
			@if (editState()) {
				<textarea
					#nodeEditor3d
					class="pptx-ng-smartart-3d-node-editor"
					[style.left.px]="editState()!.box.x"
					[style.top.px]="editState()!.box.y"
					[style.width.px]="editState()!.box.width"
					[style.height.px]="editState()!.box.height"
					[value]="editState()!.text"
					spellcheck="false"
					[attr.aria-label]="'pptx.smartArt.editNodeText' | translate"
					(input)="updateDraft($event)"
					(blur)="commitEdit()"
					(keydown)="onEditorKeydown($event)"
					(mousedown)="$event.stopPropagation()"
					(click)="$event.stopPropagation()"
					(dblclick)="$event.stopPropagation()"
				></textarea>
			}
		}
	</div>
}
