<div
	class="flex flex-col items-center gap-0.5"
	data-pptx-chrome="home-group"
	data-ribbon-group="home.font"
>
	<div data-pptx-chrome="font-controls">
		<pptx-ui-ribbon-home-font-picker
			[state]="pickerView()"
			(home-request)="pickerRequest($event)"
		/>
		<pptx-ui-ribbon-home-font [state]="fontView()" (home-request)="fontRequest($event)" />
	</div>
	<span data-pptx-chrome="ribbon-group-label">{{ 'pptx.ribbon.font' | translate }}</span>
</div>
