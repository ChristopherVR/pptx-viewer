<div class="pptx-ng-spanel">
	<!-- Scrollable slide list -->
	<div
		#scrollViewport
		class="pptx-ng-spanel-scroll"
		role="listbox"
		[attr.aria-label]="'pptx.sections.slides' | translate"
		(scroll)="onScroll()"
	>
		<div
			class="pptx-ng-spanel-space"
			[attr.data-virtualized]="shouldVirtualize() ? 'true' : null"
			[style.height.px]="shouldVirtualize() ? virtualRange().totalHeight : null"
		>
			<div
				class="pptx-ng-spanel-window"
				[class.is-virtualized]="shouldVirtualize()"
				[style.top.px]="shouldVirtualize() ? virtualRange().offsetY : null"
			>
				@for (item of renderedSlides(); track item.slide.id) {
					@let slide = item.slide;
					@let i = item.index;
					@let hidden = hiddenCue(slide, i);
					@if (item.sectionStart) {
						<header class="pptx-ng-section-header" [attr.data-section-id]="item.section?.id">
							<button
								type="button"
								class="pptx-ng-section-toggle"
								[attr.aria-expanded]="!item.section?.collapsed"
								(click)="item.section && editor.sectionOps.toggle(item.section.id)"
							>
								<span>{{ item.section?.collapsed ? '▸' : '▾' }}</span>
								<!--
									Section highlight colour (p15:sectionPr/@clr). Core parses and
									round-trips it; only React was drawing it.
								-->
								@if (item.section?.color; as sectionColor) {
									<span
										class="pptx-ng-section-swatch"
										data-pptx-section-color
										[style.background-color]="sectionColor"
									></span>
								}
								<strong>{{
									item.section?.name ?? ('pptx.slides.ungroupedSlides' | translate)
								}}</strong>
							</button>
							@if (item.section) {
								<div class="pptx-ng-section-actions">
									<button
										type="button"
										data-pptx-compact
										(click)="onRenameSection(item.section.id, item.section.name)"
									>
										✎
									</button>
									<button
										type="button"
										data-pptx-compact
										[disabled]="sectionIndex(item.section.id) === 0"
										(click)="editor.sectionOps.move(item.section.id, 'up')"
									>
										↑
									</button>
									<button
										type="button"
										data-pptx-compact
										[disabled]="sectionIndex(item.section.id) === editor.sections().length - 1"
										(click)="editor.sectionOps.move(item.section.id, 'down')"
									>
										↓
									</button>
									<button
										type="button"
										data-pptx-compact
										(click)="editor.sectionOps.delete(item.section.id)"
									>
										×
									</button>
								</div>
							}
						</header>
					}
					@if (!item.section?.collapsed) {
						<div
							class="pptx-ng-spanel-card"
							[class.is-active]="i === activeIndex()"
							[attr.data-pptx-slide-hidden]="hidden.marker ?? null"
							role="option"
							[attr.aria-selected]="i === activeIndex()"
							[attr.aria-label]="'pptx.notes.slideN' | translate: { n: i + 1 }"
						>
							<!-- Thumbnail (clickable to select). Slide number sits to the LEFT
							     of the preview (React SlideItem parity), not below it. -->
							<button
								type="button"
								class="pptx-ng-spanel-thumb-btn"
								[attr.aria-label]="'pptx.slidesPanel.goToSlide' | translate: { n: i + 1 }"
								[attr.aria-describedby]="hidden.labelId ?? null"
								(click)="select.emit(i)"
							>
								<!-- Slide number badge (left column). Struck through with the shared
								     diagonal slash when the slide is hidden, which is PowerPoint's own
								     cue and, unlike the dimming, is not a colour-only signal. -->
								<span
									class="pptx-ng-spanel-num"
									aria-hidden="true"
									[style.background-image]="hidden.hidden ? slashGradient : null"
									>{{ i + 1 }}</span
								>

								<!-- Clipping wrapper: neutralises the 1rem auto margin from SlideCanvas -->
								<div class="pptx-ng-spanel-clip" [ngStyle]="clipStyle()">
									<pptx-slide-canvas
										[slide]="slide"
										[templateElements]="editor.templateElementsBySlideId()[slide.id] ?? []"
										[canvasSize]="canvasSize()"
										[mediaDataUrls]="mediaDataUrls()"
										[zoom]="thumbZoom()"
										[editable]="false"
										[autoFit]="false"
										[interactive]="false"
										[exposeElementIds]="false"
										[style.opacity]="hidden.hidden ? dimOpacity : null"
									/>
									@if (hidden.hidden) {
										<!-- Announced through aria-describedby, so the accessible name
										     stays exactly "Go to slide {{ i + 1 }}". -->
										<span class="pptx-ng-spanel-hidden" [id]="hidden.labelId">
											<svg
												viewBox="0 0 24 24"
												fill="none"
												stroke="currentColor"
												stroke-width="2"
												stroke-linecap="round"
												stroke-linejoin="round"
												aria-hidden="true"
											>
												<path
													d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
												/>
												<path
													d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
												/>
												<path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
												<path d="M1 1l22 22" />
											</svg>
											<span class="pptx-ng-sr-only">{{ hiddenLabelKey | translate }}</span>
										</span>
									}
								</div>
							</button>

							<!-- Per-card action toolbar (visible on hover / focus-within) -->
							<div
								class="pptx-ng-spanel-actions"
								role="toolbar"
								[attr.aria-label]="'pptx.slideMenu.slideActions' | translate: { n: i + 1 }"
							>
								<button
									type="button"
									class="pptx-ng-spanel-action"
									data-pptx-compact
									[title]="'pptx.ribbon.duplicateSlide' | translate"
									[attr.aria-label]="'pptx.arrange.duplicate' | translate"
									(click)="onDuplicate(i)"
								>
									<svg lucideCopy class="h-3.5 w-3.5"></svg>
								</button>
								<button
									type="button"
									class="pptx-ng-spanel-action"
									data-pptx-compact
									[title]="'pptx.slidesPanel.deleteSlide' | translate"
									[attr.aria-label]="'pptx.arrange.delete' | translate"
									[disabled]="editor.slides().length <= 1"
									(click)="onDelete(i)"
								>
									<svg lucideTrash2 class="h-3.5 w-3.5"></svg>
								</button>
								<button
									type="button"
									class="pptx-ng-spanel-action"
									data-pptx-compact
									[title]="'pptx.sections.moveUp' | translate"
									[attr.aria-label]="'pptx.sections.moveUp' | translate"
									[disabled]="i === 0"
									(click)="onMoveUp(i)"
								>
									<svg lucideArrowUp class="h-3.5 w-3.5"></svg>
								</button>
								<button
									type="button"
									class="pptx-ng-spanel-action"
									data-pptx-compact
									[title]="'pptx.sections.moveDown' | translate"
									[attr.aria-label]="'pptx.sections.moveDown' | translate"
									[disabled]="i === editor.slides().length - 1"
									(click)="onMoveDown(i)"
								>
									<svg lucideArrowDown class="h-3.5 w-3.5"></svg>
								</button>
							</div>
						</div>
					}
				}
			</div>
		</div>
	</div>

	<!-- Footer: add new slide -->
	<footer class="pptx-ng-spanel-footer">
		<button
			type="button"
			class="pptx-ng-spanel-add"
			[attr.aria-label]="'pptx.sections.addSlide' | translate"
			(click)="onAddSlide()"
		>
			<svg lucidePlus class="h-3.5 w-3.5"></svg> {{ 'pptx.sections.addSlide' | translate }}
		</button>
	</footer>
</div>
